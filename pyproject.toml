[project]
name = "dnd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DepthDweller21", email = "muhammadharis571@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pygame>=2.6.1",
    "pygame-gui>=0.6.14",
]

[project.scripts]
rng = "dnd:main"
window = "dnd.window.main:main"
modify = "dnd.engine.utils.modifyFile:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
